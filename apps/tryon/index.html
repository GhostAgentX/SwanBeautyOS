<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161211" media="(prefers-color-scheme: dark)" />
    <title>Virtual Try-On</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar" id="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="22" height="22"><path d="M8 24c3-1 10-1 14-5 3-3 3-8 0-10-2-1-4 0-4 2 0 3 4 3 4 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 25h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span class="brand-name" id="brand-name">Virtual Try-On</span>
        </div>
        <span class="topbar-tag">Virtual Try-On</span>
      </header>

      <main class="layout">
        <section class="stage-col" aria-label="Preview">
          <div class="sources" role="group" aria-label="Try on">
            <button type="button" class="seg" data-source="camera" aria-pressed="true">Camera</button>
            <button type="button" class="seg" data-source="file" aria-pressed="false">Upload photo or video</button>
            <input id="file" type="file" accept="image/*,video/*" hidden />
          </div>
          <div class="stage-wrap">
            <div id="stage" class="stage"></div>

            <div id="intro" class="overlay">
              <div class="overlay-card">
                <h1>Try on makeup, live</h1>
                <p>Use your camera or a photo. Everything is processed on this device and never uploaded.</p>
                <button id="start" class="btn btn-primary" type="button">Start camera</button>
                <button id="start-file" class="btn" type="button" style="margin-top:10px">Use a photo instead</button>
              </div>
            </div>

            <div id="loading" class="overlay" hidden>
              <div class="overlay-card">
                <p id="loading-label" class="loading-label">Loading…</p>
                <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="loading-label">
                  <div id="loading-bar" class="progress-bar"></div>
                </div>
              </div>
            </div>

            <div id="error" class="overlay" hidden>
              <div class="overlay-card">
                <h2>Couldn't start try-on</h2>
                <p id="error-text"></p>
                <button id="retry" class="btn" type="button">Try again</button>
              </div>
            </div>

            <div class="stage-actions" id="stage-actions" hidden>
              <button id="compare" class="btn btn-glass" type="button" aria-pressed="false" title="Hold to see without makeup">Hold to compare</button>
              <div class="stage-actions-right">
                <button id="snap-png" class="btn btn-glass" type="button" title="Full-resolution PNG">Save PNG</button>
                <button id="snap-jpg" class="btn btn-glass" type="button" title="Full-resolution JPEG">JPEG</button>
                <button id="record" class="btn btn-glass" type="button" aria-pressed="false">Record</button>
              </div>
            </div>
          </div>
        </section>

        <aside class="panel" aria-label="Looks">
          <div class="panel-section">
            <h2 class="section-title">Looks</h2>
            <div id="looks" class="chips" role="group" aria-label="Looks"></div>
            <div id="looks-status" class="look-desc"></div>
          </div>
          <div class="panel-section" id="look-detail" hidden>
            <div class="look-title"><strong id="look-name"></strong></div>
            <p class="look-desc" id="look-desc"></p>
            <div id="intensity"></div>
            <h3 class="section-title" style="margin-top:16px">Shades in this look</h3>
            <ul id="shades" class="shades"></ul>
            <div class="downloads">
              <button id="dl-look" class="link-btn" type="button">Download look file</button>
              <button id="dl-banuba" class="link-btn" type="button">Banuba effect (.zip)</button>
            </div>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
