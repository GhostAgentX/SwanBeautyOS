<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1ec" />
    <title>Swan Beauty · Virtual Try-On</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="22" height="22"><path d="M8 24c3-1 10-1 14-5 3-3 3-8 0-10-2-1-4 0-4 2 0 3 4 3 4 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 25h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span class="brand-name">Swan Beauty</span>
        </div>
        <span class="topbar-tag">Virtual Try-On</span>
      </header>

      <main class="layout">
        <section class="stage-wrap" aria-label="Camera preview">
          <div id="stage" class="stage"></div>

          <div id="intro" class="overlay">
            <div class="overlay-card">
              <h1>Try on makeup, live</h1>
              <p>Your camera feed is processed on this device and never uploaded.</p>
              <button id="start" class="btn btn-primary" type="button">Start camera</button>
            </div>
          </div>

          <div id="loading" class="overlay" hidden>
            <div class="overlay-card">
              <p id="loading-label" class="loading-label">Loading…</p>
              <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="loading-label">
                <div id="loading-bar" class="progress-bar"></div>
              </div>
            </div>
          </div>

          <div id="error" class="overlay" hidden>
            <div class="overlay-card">
              <h2>Couldn't start try-on</h2>
              <p id="error-text"></p>
              <button id="retry" class="btn" type="button">Try again</button>
            </div>
          </div>

          <div class="stage-actions" id="stage-actions" hidden>
            <button id="compare" class="btn btn-glass" type="button" aria-pressed="false" title="Hold to see without makeup">
              Hold to compare
            </button>
            <button id="snap" class="btn btn-glass" type="button" title="Save a photo">Save photo</button>
          </div>
        </section>

        <aside class="panel" aria-label="Makeup controls">
          <div class="panel-section">
            <div class="section-head">
              <h2 class="section-title">Looks</h2>
              <button id="save-look" class="link-btn" type="button">Save as my look</button>
            </div>
            <div id="looks" class="chips" role="group" aria-label="Looks"></div>

            <form id="save-form" class="save-form" hidden>
              <label class="visually-hidden" for="look-name">Look name</label>
              <input id="look-name" type="text" maxlength="32" placeholder="Name this look" autocomplete="off" required />
              <button class="btn btn-small btn-accent" type="submit">Save</button>
              <button id="cancel-save" class="btn btn-small" type="button">Cancel</button>
            </form>

            <div id="look-meta" class="look-meta" aria-live="polite"></div>
            <div id="look-intensity"></div>
          </div>

          <div class="panel-section">
            <div id="tabs" class="tabs" role="tablist" aria-label="Makeup categories"></div>
            <div id="products" class="products" role="tabpanel"></div>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
